name: Site contract check (redesign branch)

# Builds the Hugo site and runs scripts/check_site.py against it (frozen URLs, citation tags, internal links,
# page budget, unrendered formulas) plus the checker's own tests. No AWS, no deploy: this workflow only exists
# on the redesign branch until the redesign merges, when the same check joins deploy-aws.yml before the S3 sync.

on:
  push:
    branches: [redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: "0.160.1"
    steps:
      - name: Cache Hugo installer
        id: cache-hugo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo.deb
          key: hugo-deb-${{ runner.os }}-${{ env.HUGO_VERSION }}

      - name: Download Hugo
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Install Hugo
        run: sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checker tests
        run: python3 scripts/test_check_site.py

      - name: Font subset tests (QS-003)
        run: |
          python3 -m venv "$RUNNER_TEMP/fontenv"
          "$RUNNER_TEMP/fontenv/bin/pip" install --quiet "fonttools==4.62.1" "brotli==1.2.0"
          "$RUNNER_TEMP/fontenv/bin/python" tools/fonts/test_fonts.py

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Jerusalem
        run: hugo --gc --minify --baseURL "https://qodeh.com/"

      - name: Site contract check
        run: python3 scripts/check_site.py public
