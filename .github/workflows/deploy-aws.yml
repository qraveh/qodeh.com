name: Deploy Hugo to AWS (S3 + CloudFront)

# Inert until the repo variables AWS_DEPLOY_ROLE_ARN / AWS_S3_BUCKET /
# AWS_CF_DISTRIBUTION_ID are set (see infra/RUNBOOK.md). Once live, this
# replaces deploy.yml (GitHub Pages), which then serves only as rollback.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC federation to AWS — no stored keys

concurrency:
  group: "aws-deploy"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.160.1"
    steps:
      - name: Cache Hugo installer
        id: cache-hugo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo.deb
          key: hugo-deb-${{ runner.os }}-${{ env.HUGO_VERSION }}

      - name: Download Hugo
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Install Hugo
        run: |
          # Safety net: a cached .deb could in principle be truncated/corrupt.
          if ! dpkg-deb --info "${{ runner.temp }}/hugo.deb" >/dev/null 2>&1; then
            echo "::warning::Hugo .deb missing or corrupt — re-downloading before install"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
              -o "${{ runner.temp }}/hugo.deb" \
              "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          fi
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Jerusalem
        run: |
          hugo --gc --minify --baseURL "https://qodeh.com/"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync ./public "s3://${{ vars.AWS_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CF_DISTRIBUTION_ID }}" \
            --paths "/*"
