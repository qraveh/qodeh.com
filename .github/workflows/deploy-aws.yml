name: Deploy Hugo to AWS (S3 + CloudFront)

# Inert until the repo variables AWS_DEPLOY_ROLE_ARN / AWS_S3_BUCKET /
# AWS_CF_DISTRIBUTION_ID are set (see infra/RUNBOOK.md). Once live, this
# replaces deploy.yml (GitHub Pages), which then serves only as rollback.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC federation to AWS — no stored keys

concurrency:
  group: "aws-deploy"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.160.1"
    steps:
      - name: Cache Hugo installer
        id: cache-hugo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo.deb
          key: hugo-deb-${{ runner.os }}-${{ env.HUGO_VERSION }}

      - name: Download Hugo
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Install Hugo
        run: |
          # Safety net: a cached .deb could in principle be truncated/corrupt.
          if ! dpkg-deb --info "${{ runner.temp }}/hugo.deb" >/dev/null 2>&1; then
            echo "::warning::Hugo .deb missing or corrupt — re-downloading before install"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
              -o "${{ runner.temp }}/hugo.deb" \
              "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          fi
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Jerusalem
        run: |
          hugo --gc --minify --baseURL "https://qodeh.com/"

      # ---- Quantum Technology Atlas ---------------------------------------------------------------
      # A static site of its own (two main pages, language fragments, 762 record pages, ~55 MB) built by
      # qraveh/qt-map. Its record pages are in git on neither side — committing them here would grow this
      # repository by tens of MB per Atlas revision — so the deploy builds it from the pinned commit, stops
      # unless the result hashes to the pin (the build is byte-reproducible on Linux/3.12; qt-map's CI
      # proves it on every push), and assembles it under public/. Nothing reaches S3 if any of this fails.
      # To update the Atlas: edit infra/atlas-pin.env (and media/, if the build's picture list changed).
      - name: Atlas — read the pin
        run: grep -E '^[A-Z0-9_]+=' infra/atlas-pin.env >> "$GITHUB_ENV"

      - name: Atlas — checkout the pinned commit
        uses: actions/checkout@v7
        with:
          repository: qraveh/qt-map
          ref: ${{ env.ATLAS_SHA }}
          path: _atlas

      - name: Atlas — Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atlas — build and check it against the pin
        working-directory: _atlas
        run: |
          test -n "$ATLAS_SHA" && test -n "$ATLAS_MAIN" && test -n "$ATLAS_DIST_SHA256"
          pip install -r requirements.txt
          python build/build.py
          echo "${ATLAS_DIST_SHA256}  dist/${ATLAS_MAIN}" | sha256sum -c -

      - name: Atlas — assemble under public/
        run: |
          A="public/publications/quantum-technology-atlas"
          mkdir -p "$A"
          cp -a _atlas/dist/. "$A/"
          rm -f "$A/media-files.txt"
          # the pictures are this repository's (static/…/media/, already in public/ from the Hugo build);
          # every one the pages show must be there — build/DEPLOY.md: the deploy fails on a missing file
          missing=0
          while read -r f; do
            if [ -n "$f" ] && [ ! -f "$A/media/$f" ]; then echo "missing picture: $f"; missing=$((missing + 1)); fi
          done < _atlas/dist/media-files.txt
          if [ "$missing" -ne 0 ]; then echo "::error::$missing picture(s) missing from media/"; exit 1; fi
          for f in index.html ru/index.html "$ATLAS_MAIN" "ru/$ATLAS_MAIN" lang/en.js lang/ru.js sitemap.xml; do
            test -f "$A/$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "Atlas assembled: $(find "$A" -type f | wc -l) files, $(du -sh "$A" | cut -f1)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          B="s3://${{ vars.AWS_S3_BUCKET }}"
          A="publications/quantum-technology-atlas"
          # 1. the Hugo site; the Atlas prefix is left to passes 2 and 3, and is not deleted by this one
          aws s3 sync ./public "$B" --delete --exclude "$A/*"
          # 2. the Atlas, all but its pages and language fragments (pictures, styles, scripts, sitemap)
          aws s3 sync "./public/$A" "$B/$A" --delete --exclude "*.html" --exclude "lang/*.js"
          # 3. its pages and language fragments, revalidated on every visit: a page and its fragment must
          #    match slot for slot, and beta revisions redeploy under the same names (build/DEPLOY.md §6)
          aws s3 sync "./public/$A" "$B/$A" --delete --exclude "*" --include "*.html" --include "lang/*.js" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CF_DISTRIBUTION_ID }}" \
            --paths "/*"
